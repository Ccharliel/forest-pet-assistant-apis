name: Auto Deployment

on:
  push:
    tags:
      - 'v*'

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: tool-server
            dockerfile: tool_server/Dockerfile
            context: tool_server
          - name: assistant-server
            dockerfile: assistant_server/Dockerfile
            context: assistant_server

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract tag name
      id: get-tag
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: |
        docker build \
          -f ${{ matrix.dockerfile }} \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.name }}:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.name }}:${{ steps.get-tag.outputs.TAG }} \
          ${{ matrix.context }}

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.name }}:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.name }}:${{ steps.get-tag.outputs.TAG }}